spring.application.name=AlphaMedPro

# Base de donnees MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/alphamedpro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=frawen25@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de connexions (HikariCP) - recuperation automatique apres coupure/redemarrage de MySQL
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Serveur
server.port=8080
